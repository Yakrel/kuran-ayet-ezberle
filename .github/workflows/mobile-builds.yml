name: Android Native CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: android-native-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-checks:
    name: Gradle test, lint, debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace --warning-mode all

      - name: Run Android lint
        working-directory: android
        run: ./gradlew lintDebug --stacktrace --warning-mode all

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace --warning-mode all

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
